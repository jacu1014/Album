<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🩰 Mi Diario Secreto de Ballet</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --rosa-principal: #FADADD;
            --rosa-fuerte: #F8BBD0;
            --verde-menta: #E0F2F1;
            --dorado: #D4AF37;
            --texto: #4E342E;
            --blanco-papel: #FFFFFF;
            --beige-libro: #F9F4F0;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%);
            margin: 0; color: var(--texto); min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        /* Barra de Progreso */
        #progress-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 12px;
            background: rgba(255,255,255,0.5); z-index: 1000;
        }
        #progress-bar {
            width: 0%; height: 100%; background: linear-gradient(to right, var(--dorado), #FFF176);
            box-shadow: 0 0 10px var(--dorado); transition: width 0.5s ease;
        }

        /* Menú Inferior */
        nav {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.98); padding: 10px 25px; border-radius: 40px;
            display: flex; gap: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px); z-index: 100; border: 2px solid var(--rosa-principal);
        }
        .nav-item { cursor: pointer; font-size: 24px; transition: 0.3s; filter: grayscale(1); }
        .nav-item.active { filter: grayscale(0); transform: scale(1.3); }

        /* Contenedor tipo Libro */
        .book-container {
            width: 90%; max-width: 500px; margin-top: 40px; margin-bottom: 120px;
            perspective: 1000px;
        }

        header { 
            background: var(--blanco-papel); padding: 30px 20px; 
            border-radius: 20px 20px 5px 5px; text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05); border-bottom: 2px dashed var(--rosa-principal);
        }
        h1 { font-family: 'Dancing Script', cursive; font-size: 2.5rem; color: var(--dorado); margin: 0; }
        
        .message-box {
            background: var(--beige-libro); margin-top: 15px; padding: 15px;
            border-left: 4px solid var(--dorado); font-style: italic; border-radius: 5px;
        }

        /* Tarjetas Estilo Página */
        #exercise-list { display: flex; flex-direction: column; gap: 20px; margin-top: 10px; }

        .exercise-card {
            background: var(--blanco-papel); border-radius: 10px; overflow: hidden;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.08); border: 1px solid #eee;
            transition: transform 0.3s;
        }

        .img-preview {
            width: 100%; height: 200px; background: #f0f0f0;
            overflow: hidden; display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        .img-preview img { width: 100%; height: 100%; object-fit: cover; }
        
        .cat-tag {
            position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,0.9);
            padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: bold;
            color: var(--dorado); border: 1px solid var(--dorado);
        }

        .card-content { padding: 20px; display: flex; align-items: flex-start; gap: 15px; }
        
        .icon-circle {
            min-width: 50px; height: 50px; background: var(--verde-menta);
            border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px;
        }

        .text-info { flex: 1; }
        .text-info h3 { margin: 0; font-size: 1.1rem; color: #333; }
        .text-info p { margin: 8px 0 0; font-size: 0.9rem; color: #777; line-height: 1.4; }

        .btn-check {
            background: white; border: 2px solid var(--rosa-principal);
            min-width: 50px; height: 50px; border-radius: 50%;
            cursor: pointer; font-size: 20px; transition: 0.3s; align-self: center;
        }
        .btn-check.done { background: var(--dorado); color: white; border-color: var(--dorado); transform: scale(1.1); }

        #reset-btn {
            background: none; border: none; color: #999; text-decoration: underline;
            margin: 20px auto; display: block; cursor: pointer; font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div id="progress-container"><div id="progress-bar"></div></div>

    <nav>
        <div class="nav-item active" onclick="filterData('Todos', this)">🏠</div>
        <div class="nav-item" onclick="filterData('Pies', this)">🩰</div>
        <div class="nav-item" onclick="filterData('Brazos', this)">👐</div>
        <div class="nav-item" onclick="filterData('Movimiento', this)">✨</div>
    </nav>

    <div class="book-container">
        <header>
            <h1>Mi Diario de Ballet</h1>
            <div class="message-box" id="daily-message">"Abriendo el libro de los sueños..."</div>
        </header>

        <div id="exercise-list">
            <div id="loader" style="text-align:center; padding: 40px;">✨ Cargando tus páginas mágicas...</div>
        </div>
        
        <button id="reset-btn" onclick="resetDay()">Limpiar todas las estrellas de hoy</button>
    </div>

    <audio id="pop-sound" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"></audio>

    <script>
        const SHEET_ID = '1KcKRT5gZqatDkeRsQQa6_aWBr9gnrkGRR1vsmZjmRoI';
        const URL_EJERCICIOS = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Ejercicios`;
        const URL_CONFIG = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Configuración`;

        let allExercises = [];
        let doneTasks = 0;

        function parseGoogleResponse(text) {
            const base64 = text.substring(text.indexOf("{"), text.lastIndexOf("}") + 1);
            return JSON.parse(base64);
        }

        async function loadData() {
            try {
                // 1. Mensaje de la hoja Configuración
                const resConfig = await fetch(URL_CONFIG);
                const jsonConfig = parseGoogleResponse(await resConfig.text());
                const mensaje = jsonConfig.table.rows[0]?.c[1]?.v || "¡A bailar, princesa!";
                document.getElementById('daily-message').innerText = `"${mensaje}"`;

                // 2. Datos de Ejercicios (Incluyendo la columna 4 para la imagen)
                const resEx = await fetch(URL_EJERCICIOS);
                const jsonEx = parseGoogleResponse(await resEx.text());
                
                allExercises = jsonEx.table.rows.map(r => ({
                    cat: r.c[1]?.v || 'Varios',
                    titulo: r.c[2]?.v || 'Sin título',
                    desc: r.c[3]?.v || '',
                    img: r.c[4]?.v || '', // Columna E en tu Excel
                    icon: getIcon(r.c[1]?.v || '')
                }));

                render(allExercises);
            } catch (e) {
                console.error(e);
                document.getElementById('exercise-list').innerHTML = "⚠️ Error al cargar el libro.";
            }
        }

        function getIcon(cat) {
            const c = cat.toLowerCase();
            if(c.includes('pies')) return '👣';
            if(c.includes('brazos')) return '👐';
            if(c.includes('movimiento')) return '✨';
            return '🌸';
        }

        function render(data) {
            const list = document.getElementById('exercise-list');
            list.innerHTML = '';
            
            data.forEach(ex => {
                const card = document.createElement('div');
                card.className = 'exercise-card';
                
                // Si no hay imagen en el Excel, usamos una genérica de ballet
                const imageSrc = ex.img || 'https://images.unsplash.com/photo-1518834107812-67b0b7c58434?auto=format&fit=crop&w=500&q=80';

                card.innerHTML = `
                    <div class="img-preview">
                        <span class="cat-tag">${ex.cat}</span>
                        <img src="${imageSrc}" alt="${ex.titulo}">
                    </div>
                    <div class="card-content">
                        <div class="icon-circle">${ex.icon}</div>
                        <div class="text-info">
                            <h3>${ex.titulo}</h3>
                            <p>${ex.desc}</p>
                        </div>
                        <button class="btn-check" onclick="completeTask(this)">⭐</button>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function filterData(cat, el) {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            if(cat === 'Todos') render(allExercises);
            else render(allExercises.filter(e => e.cat.toLowerCase().includes(cat.toLowerCase())));
        }

        function completeTask(btn) {
            if(!btn.classList.contains('done')) {
                btn.classList.add('done');
                btn.innerText = '✔';
                doneTasks++;
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.8 }, colors: ['#FADADD', '#D4AF37'] });
                try { document.getElementById('pop-sound').play(); } catch(e){}
            } else {
                btn.classList.remove('done');
                btn.innerText = '⭐';
                doneTasks--;
            }
            updateProgress();
        }

        function updateProgress() {
            const percent = (doneTasks / (allExercises.length || 1)) * 100;
            document.getElementById('progress-bar').style.width = percent + '%';
        }

        function resetDay() {
            if(confirm("¿Quieres limpiar las estrellas de hoy?")) {
                doneTasks = 0;
                updateProgress();
                render(allExercises);
            }
        }

        loadData();
    </script>
</body>
</html>
