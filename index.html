<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🩰 Mi Diario de Ballet Interactivo</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --rosa-principal: #FADADD;
            --dorado: #D4AF37;
            --texto: #4E342E;
            --blanco-papel: #FFFFFF;
            --azul-borde: #00BCD4; 
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: #1a2a2a; 
            margin: 0; padding: 10px;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }

        .main-wrapper {
            display: flex; align-items: center;
            width: 100%; max-width: 1100px;
        }

        .side-tabs {
            display: flex; flex-direction: column; gap: 8px;
            z-index: 1; margin-right: -5px;
        }

        .tab-btn {
            background: var(--rosa-principal); border: none;
            border-radius: 12px 0 0 12px; padding: 15px;
            cursor: pointer; font-size: 1.4rem; transition: 0.3s;
            box-shadow: -4px 4px 10px rgba(0,0,0,0.3);
        }

        .tab-btn.active { background: var(--blanco-papel); transform: translateX(8px); }

        .book-container {
            flex: 1; background: var(--azul-borde);
            padding: 12px; border-radius: 15px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            position: relative; z-index: 2;
        }

        .book-content {
            background: var(--blanco-papel);
            display: flex; min-height: 550px; height: 85vh;
            border-radius: 5px; position: relative;
            background-image: linear-gradient(to right, #e0e0e0 0%, #fff 5%, #fff 45%, #b1b1b1 50%, #fff 55%, #fff 95%, #e0e0e0 100%);
        }

        .page {
            flex: 1; padding: 30px 40px;
            display: flex; flex-direction: column;
            position: relative;
        }

        /* AJUSTE DEL ÍNDICE PARA QUE NO CHOQUE CON FLECHAS */
        .index-container {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 50px; /* Espacio para las flechas */
            padding-right: 10px;
        }

        /* Estilo del Scrollbar del índice */
        .index-container::-webkit-scrollbar { width: 5px; }
        .index-container::-webkit-scrollbar-thumb { background: var(--rosa-principal); border-radius: 10px; }

        .index-item {
            padding: 10px 0; border-bottom: 1px dashed #eee;
            cursor: pointer; display: flex; justify-content: space-between;
            font-size: 0.95rem;
        }

        /* POSICIONAMIENTO DE FLECHAS TIPO LIBRO REAL */
        .arrow {
            position: absolute; bottom: 20px;
            background: #4a90e2; color: white; border: none;
            width: 40px; height: 40px; border-radius: 8px;
            cursor: pointer; font-size: 1.2rem; display: flex;
            align-items: center; justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            z-index: 20;
        }
        .arrow-prev { left: 20px; }
        .arrow-next { right: 20px; }

        .exercise-focus { text-align: center; }
        .img-large {
            width: 100%; max-height: 250px; object-fit: contain;
            border: 5px solid white; border-radius: 5px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .progress-box {
            background: #f0fafa; padding: 15px; border-radius: 15px;
            text-align: center; margin-bottom: 15px;
        }

        @media (max-width: 800px) {
            .book-content { flex-direction: column; }
            .page { height: 50%; }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="side-tabs">
            <button class="tab-btn active" onclick="changeCategory('Todos', this)">🏠</button>
            <button class="tab-btn" onclick="changeCategory('Pies', this)">🩰</button>
            <button class="tab-btn" onclick="changeCategory('Brazos', this)">👐</button>
            <button class="tab-btn" onclick="changeCategory('Movimiento', this)">✨</button>
        </div>

        <div class="book-container">
            <div class="book-content">
                <div class="page">
                    <h2 style="font-family:'Dancing Script'; color:var(--dorado)">Índice de Ejercicios</h2>
                    <div class="progress-box">
                        <strong id="ui-percent">0%</strong> completado | <span id="ui-stars">0/0</span> ⭐
                    </div>
                    <div class="index-container" id="ui-index">
                        </div>
                    <button class="arrow arrow-prev" onclick="prevPage()">⬅</button>
                </div>

                <div class="page" id="page-render">
                    </div>
                <button class="arrow arrow-next" onclick="nextPage()">➡</button>
            </div>
        </div>
    </div>

    <script>
        // URL corregida para evitar errores de CORS y conexión
        const SHEET_ID = '1KcKRT5gZqatDkeRsQQa6_aWBr9gnrkGRR1vsmZjmRoI';
        const URL_EJERCICIOS = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`;
        
        let allExercises = [];
        let filteredExercises = [];
        let currentIndex = 0;
        let completedSet = new Set();

        async function init() {
            try {
                const res = await fetch(URL_EJERCICIOS);
                const csvData = await res.text();
                const rows = csvData.split('\n').slice(1); // Saltar encabezado
                
                allExercises = rows.map((row, i) => {
                    const cols = row.split(','); // Nota: Esto es básico, si hay comas en el texto usa un parser CSV
                    return {
                        id: i,
                        cat: cols[1] || 'Varios',
                        titulo: cols[2] || 'Ejercicio',
                        desc: cols[3] || '',
                        img: cols[4] || ''
                    };
                });

                filteredExercises = [...allExercises];
                updateUI();
                renderPage();
            } catch (e) {
                console.error("Error cargando datos:", e);
                document.getElementById('ui-index').innerHTML = "<p style='color:red'>⚠️ Error al conectar con Google Sheets. Verifica que esté publicado.</p>";
            }
        }

        function renderPage() {
            const container = document.getElementById('page-render');
            const ex = filteredExercises[currentIndex];
            if (!ex) return;

            const isDone = completedSet.has(ex.id);
            container.innerHTML = `
                <div class="exercise-focus">
                    <h2 style="font-family:'Dancing Script'; color:var(--dorado)">${ex.titulo}</h2>
                    <img src="${ex.img.trim()}" class="img-large" onerror="this.src='https://via.placeholder.com/400x300?text=Ballet'">
                    <p style="margin:15px 0; font-style:italic">${ex.desc}</p>
                    <button onclick="toggleStar(${ex.id})" style="background:none; border:none; font-size:3rem; cursor:pointer">
                        ${isDone ? '✅' : '⭐'}
                    </button>
                </div>
            `;
        }

        function updateUI() {
            const indexList = document.getElementById('ui-index');
            indexList.innerHTML = '';
            filteredExercises.forEach((ex, i) => {
                const item = document.createElement('div');
                item.className = 'index-item';
                item.innerHTML = `<span>${i+1}. ${ex.titulo}</span> <span>${completedSet.has(ex.id) ? '✅' : '⚪'}</span>`;
                item.onclick = () => { currentIndex = i; renderPage(); };
                indexList.appendChild(item);
            });

            const total = allExercises.length;
            const done = completedSet.size;
            document.getElementById('ui-percent').innerText = total > 0 ? Math.round((done/total)*100) + '%' : '0%';
            document.getElementById('ui-stars').innerText = `${done}/${total}`;
        }

        function toggleStar(id) {
            if(completedSet.has(id)) completedSet.delete(id);
            else {
                completedSet.add(id);
                confetti({ particleCount: 100, origin: { y: 0.7 } });
            }
            updateUI();
            renderPage();
        }

        function nextPage() { if (currentIndex < filteredExercises.length - 1) { currentIndex++; renderPage(); } }
        function prevPage() { if (currentIndex > 0) { currentIndex--; renderPage(); } }

        function changeCategory(cat, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filteredExercises = cat === 'Todos' ? [...allExercises] : allExercises.filter(e => e.cat.includes(cat));
            currentIndex = 0;
            updateUI();
            renderPage();
        }

        init();
    </script>
</body>
</html>
