<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🩰 Mi Diario Secreto de Ballet</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --rosa-principal: #FADADD;
            --rosa-fuerte: #F8BBD0;
            --verde-menta: #E0F2F1;
            --dorado: #D4AF37;
            --texto: #4E342E;
            --blanco-papel: #FFFFFF;
            --azul-borde: #00BCD4; 
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: #1a2a2a; 
            margin: 0; padding: 15px;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }

        .book-frame {
            background: var(--azul-borde);
            padding: 15px; border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            width: 100%; max-width: 1100px;
            position: relative;
        }

        .book-pages {
            background: var(--blanco-papel);
            display: flex; min-height: 650px;
            position: relative; border-radius: 8px;
            overflow: hidden;
            background-image: linear-gradient(to right, #e5e5e5 0%, #ffffff 5%, #ffffff 45%, #d1d1d1 50%, #ffffff 55%, #ffffff 95%, #e5e5e5 100%);
        }

        .book-pages::before {
            content: ''; position: absolute; left: 50%; top: 0; bottom: 0;
            width: 3px; background: rgba(0,0,0,0.1); transform: translateX(-50%);
            z-index: 10;
        }

        /* LADO IZQUIERDO: Control y Estadísticas */
        .page-left {
            flex: 0.8; padding: 30px; border-right: 1px solid rgba(0,0,0,0.05);
            display: flex; flex-direction: column; align-items: center;
        }

        /* LADO DERECHO: Cuadrícula de Ejercicios */
        .page-right {
            flex: 1.2; padding: 30px;
            overflow-y: auto; max-height: 750px;
        }

        h1 { font-family: 'Dancing Script', cursive; font-size: 2.2rem; color: var(--dorado); margin: 0; text-align: center; }

        /* Panel de Estadísticas */
        .stats-panel {
            background: var(--verde-menta);
            width: 100%; border-radius: 15px;
            padding: 15px; margin: 20px 0;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
            text-align: center;
        }
        .stat-item { margin: 10px 0; font-weight: 700; color: var(--texto); }
        .stat-val { color: var(--dorado); font-size: 1.4rem; display: block; }

        /* Menú de Navegación Vertical */
        .nav-menu {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
            width: 100%; margin-top: auto;
        }
        .nav-btn {
            background: white; border: 2px solid var(--rosa-principal);
            padding: 10px; border-radius: 12px; cursor: pointer;
            font-size: 1.5rem; transition: 0.3s; display: flex;
            justify-content: center; align-items: center;
        }
        .nav-btn.active { background: var(--rosa-principal); transform: scale(1.05); }

        /* Cuadrícula de 2 Ejercicios por fila */
        .exercise-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
        }

        .exercise-slot {
            background: #fdfdfd; border: 1px solid #eee;
            padding: 10px; border-radius: 10px;
            display: flex; flex-direction: column;
            text-align: center; position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .slot-title {
            font-weight: 700; font-size: 0.9rem; margin-bottom: 8px;
            color: var(--texto); height: 40px; display: flex;
            align-items: center; justify-content: center;
        }

        .slot-img {
            width: 100%; aspect-ratio: 1/1; object-fit: cover;
            border-radius: 8px; border: 3px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .slot-check {
            position: absolute; bottom: 15px; right: 15px;
            background: white; border: 2px solid var(--rosa-principal);
            width: 35px; height: 35px; border-radius: 50%;
            cursor: pointer; font-size: 16px; z-index: 5;
        }
        .slot-check.done { background: var(--dorado); border-color: var(--dorado); color: white; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @media (max-width: 768px) {
            .book-pages { flex-direction: column; }
            .book-pages::before { display: none; }
            .exercise-grid { grid-template-columns: 1fr; }
            .page-left { flex: none; }
        }
    </style>
</head>
<body>

    <div class="book-frame">
        <div class="book-pages">
            <div class="page-left">
                <h1>Mi Diario</h1>
                
                <div class="stats-panel">
                    <div class="stat-item">Progreso <span class="stat-val" id="stat-pc">0%</span></div>
                    <div class="stat-item">Estrellas <span class="stat-val" id="stat-stars">0 / 0</span></div>
                </div>

                <div id="daily-message" style="font-style: italic; font-size: 0.9rem; text-align: center; margin-bottom: 20px; color: #666;">
                    "Cargando..."
                </div>

                <div class="nav-menu">
                    <button class="nav-btn active" title="Inicio" onclick="filterData('Todos', this)">🏠</button>
                    <button class="nav-btn" title="Pies" onclick="filterData('Pies', this)">🩰</button>
                    <button class="nav-btn" title="Brazos" onclick="filterData('Brazos', this)">👐</button>
                    <button class="nav-btn" title="Movimiento" onclick="filterData('Movimiento', this)">✨</button>
                </div>
            </div>

            <div class="page-right">
                <div class="exercise-grid" id="exercise-grid">
                    </div>
            </div>
        </div>
    </div>

    <audio id="pop-sound" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"></audio>

    <script>
        const SHEET_ID = '1KcKRT5gZqatDkeRsQQa6_aWBr9gnrkGRR1vsmZjmRoI';
        const URL_EJERCICIOS = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Ejercicios`;
        const URL_CONFIG = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Configuracion`;

        let allExercises = [];
        let completedIds = new Set();

        function cleanJSON(text) {
            return JSON.parse(text.substring(text.indexOf("{"), text.lastIndexOf("}") + 1));
        }

        async function init() {
            try {
                // Mensaje y Configuración
                const resC = await fetch(URL_CONFIG);
                const jsonC = cleanJSON(await resC.text());
                document.getElementById('daily-message').innerText = `"${jsonC.table.rows[0]?.c[1]?.v || '¡A brillar!'}"`;

                // Ejercicios
                const resE = await fetch(URL_EJERCICIOS);
                const jsonE = cleanJSON(await resE.text());
                allExercises = jsonE.table.rows.map((r, index) => ({
                    id: index,
                    cat: r.c[1]?.v || '',
                    titulo: r.c[2]?.v || 'Sin título',
                    desc: r.c[3]?.v || '',
                    img: r.c[4]?.v || 'https://images.unsplash.com/photo-1518834107812-67b0b7c58434?w=400'
                }));

                updateStats();
                render('Todos');
            } catch (e) {
                console.error(e);
            }
        }

        function render(filter) {
            const grid = document.getElementById('exercise-grid');
            grid.innerHTML = '';
            
            const filtered = filter === 'Todos' ? allExercises : allExercises.filter(e => e.cat.includes(filter));

            filtered.forEach(ex => {
                const isDone = completedIds.has(ex.id);
                const slot = document.createElement('div');
                slot.className = 'exercise-slot';
                slot.innerHTML = `
                    <div class="slot-title">${ex.titulo}</div>
                    <img src="${ex.img}" class="slot-img" alt="Ballet">
                    <button class="slot-check ${isDone ? 'done' : ''}" onclick="toggleTask(${ex.id}, this)">
                        ${isDone ? '✔' : '⭐'}
                    </button>
                `;
                grid.appendChild(slot);
            });
        }

        function toggleTask(id, btn) {
            if (completedIds.has(id)) {
                completedIds.delete(id);
                btn.classList.remove('done');
                btn.innerText = '⭐';
            } else {
                completedIds.add(id);
                btn.classList.add('done');
                btn.innerText = '✔';
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.8 }, colors: ['#D4AF37', '#FADADD'] });
                document.getElementById('pop-sound').play();
            }
            updateStats();
        }

        function updateStats() {
            const total = allExercises.length;
            const done = completedIds.size;
            const pc = total > 0 ? Math.round((done / total) * 100) : 0;
            
            document.getElementById('stat-pc').innerText = pc + '%';
            document.getElementById('stat-stars').innerText = `${done} / ${total}`;
        }

        function filterData(cat, btn) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render(cat);
        }

        init();
    </script>
</body>
</html>
