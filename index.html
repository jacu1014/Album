<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🩰 Mi Diario Secreto de Ballet</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --rosa-principal: #FADADD;
            --rosa-fuerte: #F8BBD0;
            --verde-menta: #E0F2F1;
            --dorado: #D4AF37;
            --texto: #2C1E1B;
            --blanco-papel: #FDFDFD;
            --azul-borde: #00BCD4; /* El azul cian de la imagen de referencia */
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: #1a2a2a; /* Fondo oscuro para resaltar el libro */
            margin: 0; padding: 20px;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow-x: hidden;
        }

        /* Contenedor del Libro Abierto */
        .book-frame {
            background: var(--azul-borde);
            padding: 15px; border-radius: 10px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            width: 95%; max-width: 1000px;
            position: relative;
        }

        .book-pages {
            background: var(--blanco-papel);
            display: flex; min-height: 600px;
            position: relative; border-radius: 4px;
            overflow: hidden;
            background-image: linear-gradient(to right, #e0e0e0 0%, #ffffff 5%, #ffffff 45%, #d1d1d1 50%, #ffffff 55%, #ffffff 95%, #e0e0e0 100%);
        }

        /* Sombra central (el lomo del libro) */
        .book-pages::before {
            content: ''; position: absolute; left: 50%; top: 0; bottom: 0;
            width: 2px; background: rgba(0,0,0,0.1); transform: translateX(-50%);
            z-index: 10;
        }

        /* Página Izquierda (Mensaje y Filtros) */
        .page-left {
            flex: 1; padding: 40px; border-right: 1px solid rgba(0,0,0,0.05);
            display: flex; flex-direction: column; align-items: center;
        }

        /* Página Derecha (Ejercicios) */
        .page-right {
            flex: 1; padding: 40px;
            overflow-y: auto; max-height: 700px;
        }

        /* Títulos estilo Libro de Arena */
        h1 { font-family: 'Dancing Script', cursive; font-size: 2.2rem; color: #d32f2f; margin-bottom: 5px; text-align: center; }
        .subtitle { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px; color: var(--texto); margin-bottom: 20px; }

        .message-quote {
            font-style: italic; text-align: center; border-top: 1px solid #ccc;
            border-bottom: 1px solid #ccc; padding: 20px 0; margin: 20px 0;
            line-height: 1.6; color: #444; width: 100%;
        }

        /* Estilo de los ejercicios dentro del libro */
        .exercise-item {
            margin-bottom: 30px; border-bottom: 1px dashed #ddd; padding-bottom: 20px;
            animation: fadeIn 0.8s ease;
        }

        .exercise-img {
            width: 100%; border-radius: 5px; margin-bottom: 15px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.1); border: 5px solid white;
        }

        .exercise-info h3 { font-family: 'Quicksand', sans-serif; margin: 0; color: #d32f2f; font-size: 1.1rem; }
        .exercise-info p { font-size: 0.9rem; color: #555; line-height: 1.4; margin: 5px 0; }

        .btn-star {
            background: none; border: 2px solid var(--rosa-principal);
            border-radius: 50%; width: 40px; height: 40px; cursor: pointer; font-size: 18px;
            transition: 0.3s;
        }
        .btn-star.done { background: var(--dorado); border-color: var(--dorado); color: white; }

        /* Navegación dentro del libro */
        .book-nav { display: flex; gap: 15px; margin-top: auto; padding-top: 20px; }
        .nav-icon { 
            font-size: 1.5rem; cursor: pointer; transition: 0.3s; opacity: 0.5;
        }
        .nav-icon.active { opacity: 1; transform: scale(1.2); }

        /* Detalles de esquinas dobladas */
        .corner {
            position: absolute; bottom: 0; width: 50px; height: 50px;
            background: linear-gradient(135deg, transparent 50%, rgba(0,0,0,0.1) 50%, #ddd 100%);
            z-index: 20;
        }
        .corner-left { left: 0; transform: scaleX(-1); }
        .corner-right { right: 0; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Adaptación móvil (una sola página) */
        @media (max-width: 768px) {
            .book-pages { flex-direction: column; }
            .book-pages::before { display: none; }
            .page-right { max-height: none; }
        }
    </style>
</head>
<body>

    <div class="book-frame">
        <div class="book-pages">
            <div class="page-left">
                <h1>Mi Diario de Ballet</h1>
                <div class="subtitle">Jorge Luis Ceballos (Papá)</div>
                
                <div class="message-quote" id="daily-message">
                    ... cargando inspiración mágica ...
                </div>

                <div class="book-nav">
                    <span class="nav-icon active" onclick="filterData('Todos', this)">🏠</span>
                    <span class="nav-icon" onclick="filterData('Pies', this)">🩰</span>
                    <span class="nav-icon" onclick="filterData('Brazos', this)">👐</span>
                    <span class="nav-icon" onclick="filterData('Movimiento', this)">✨</span>
                </div>
            </div>

            <div class="page-right" id="exercise-list">
                <p style="text-align:center">Abriendo el libro...</p>
            </div>

            <div class="corner corner-left"></div>
            <div class="corner corner-right"></div>
        </div>
    </div>

    <audio id="pop-sound" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"></audio>

    <script>
        const SHEET_ID = '1KcKRT5gZqatDkeRsQQa6_aWBr9gnrkGRR1vsmZjmRoI';
        const URL_EJERCICIOS = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Ejercicios`;
        const URL_CONFIG = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Configuración`;

        let allExercises = [];

        function parseGoogleResponse(text) {
            const base64 = text.substring(text.indexOf("{"), text.lastIndexOf("}") + 1);
            return JSON.parse(base64);
        }

        async function loadData() {
            try {
                // 1. Mensaje de Configuración
                const resConfig = await fetch(URL_CONFIG);
                const jsonConfig = parseGoogleResponse(await resConfig.text());
                // El mensaje está en la fila 0, columna 1
                const mensaje = jsonConfig.table.rows[0]?.c[1]?.v || "¡Hoy vas a brillar!";
                document.getElementById('daily-message').innerText = `"${mensaje}"`;

                // 2. Ejercicios
                const resEx = await fetch(URL_EJERCICIOS);
                const jsonEx = parseGoogleResponse(await resEx.text());
                
                allExercises = jsonEx.table.rows.map(r => ({
                    cat: r.c[1]?.v || 'Varios',
                    titulo: r.c[2]?.v || 'Sin título',
                    desc: r.c[3]?.v || '',
                    img: r.c[4]?.v || '',
                }));

                render(allExercises);
            } catch (e) {
                document.getElementById('exercise-list').innerHTML = "<p>Error al abrir el libro.</p>";
            }
        }

        function render(data) {
            const list = document.getElementById('exercise-list');
            list.innerHTML = '';
            
            data.forEach(ex => {
                const item = document.createElement('div');
                item.className = 'exercise-item';
                
                // Si hay link de imagen en el Excel (columna E), se usa. Si no, una genérica.
                const imgSource = ex.img ? ex.img : 'https://images.unsplash.com/photo-1547153760-18fc86324498?auto=format&fit=crop&w=400&q=80';

                item.innerHTML = `
                    <img src="${imgSource}" class="exercise-img">
                    <div class="exercise-info">
                        <h3>${ex.titulo}</h3>
                        <p>${ex.desc}</p>
                        <button class="btn-star" onclick="completeTask(this)">⭐</button>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function filterData(cat, el) {
            document.querySelectorAll('.nav-icon').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            if(cat === 'Todos') render(allExercises);
            else render(allExercises.filter(e => e.cat.toLowerCase().includes(cat.toLowerCase())));
        }

        function completeTask(btn) {
            if(!btn.classList.contains('done')) {
                btn.classList.add('done');
                btn.innerText = '✔';
                confetti({ 
                    particleCount: 150, 
                    spread: 70, 
                    origin: { y: 0.7 }, 
                    colors: ['#FADADD', '#D4AF37', '#00BCD4'] 
                });
                try { document.getElementById('pop-sound').play(); } catch(e){}
            } else {
                btn.classList.remove('done');
                btn.innerText = '⭐';
            }
        }

        loadData();
    </script>
</body>
</html>
