<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🩰 Mi Diario Secreto de Ballet</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --rosa-principal: #FADADD;
            --rosa-fuerte: #F8BBD0;
            --verde-menta: #E0F2F1;
            --dorado: #D4AF37;
            --texto: #4E342E;
            --blanco-papel: #FFFFFF;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%);
            margin: 0;
            color: var(--texto);
            min-height: 100vh;
        }

        /* Barra de Progreso */
        #progress-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 12px;
            background: rgba(255,255,255,0.5);
            z-index: 1000;
        }
        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(to right, var(--dorado), #FFF176);
            box-shadow: 0 0 10px var(--dorado);
            transition: width 0.5s ease;
        }

        /* Menú Flotante */
        nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 25px;
            border-radius: 40px;
            display: flex;
            gap: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            z-index: 100;
            border: 2px solid var(--rosa-principal);
        }

        .nav-item {
            cursor: pointer;
            font-size: 24px;
            transition: 0.3s;
            filter: grayscale(1);
        }
        .nav-item.active {
            filter: grayscale(0);
            transform: scale(1.3);
        }

        /* Libro Contenedor */
        .book-page {
            max-width: 600px;
            margin: 40px auto 120px;
            padding: 20px;
        }

        header { text-align: center; margin-bottom: 30px; }
        h1 { font-family: 'Dancing Script', cursive; font-size: 2.8rem; color: var(--dorado); margin-bottom: 5px; }
        
        #daily-message {
            font-style: italic;
            color: #888;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        /* Tarjetas de Ejercicios */
        .exercise-card {
            background: var(--blanco-papel);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 15px;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .icon-box {
            width: 60px;
            height: 60px;
            background: var(--verde-menta);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
        }

        .card-body { flex: 1; }
        .card-body h3 { margin: 0; font-size: 1.1rem; }
        .card-body p { margin: 5px 0 0; font-size: 0.9rem; color: #666; }

        .btn-check {
            background: white;
            border: 2px solid var(--rosa-principal);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            transition: 0.3s;
        }

        .btn-check.done {
            background: var(--dorado);
            color: white;
            border-color: var(--dorado);
        }

        #loader { text-align: center; margin-top: 50px; font-size: 1.2rem; color: var(--dorado); }
    </style>
</head>
<body>

    <div id="progress-container"><div id="progress-bar"></div></div>

    <nav>
        <div class="nav-item active" title="Todo" onclick="filterData('Todos', this)">🏠</div>
        <div class="nav-item" title="Pies" onclick="filterData('Pies', this)">🩰</div>
        <div class="nav-item" title="Brazos" onclick="filterData('Brazos', this)">👐</div>
        <div class="nav-item" title="Movimiento" onclick="filterData('Movimiento', this)">✨</div>
    </nav>

    <div class="book-page">
        <header>
            <h1>Mi Diario de Ballet</h1>
            <div id="daily-message">Cargando inspiración...</div>
        </header>

        <div id="loader">Abriendo el libro mágico...</div>
        <div id="exercise-list"></div>
    </div>

    <audio id="pop-sound" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"></audio>

    <script>
        // ID de tu hoja de Google
        const SHEET_ID = '1KcKRT5gZqatDkeRsQQa6_aWBr9gnrkGRR1vsmZjmRoI';
        // URL específica para la pestaña "Ejercicios" (gid=0 por defecto es la primera hoja)
        const URL_EJERCICIOS = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Ejercicios`;
        const URL_CONFIG = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Configuracion`;

        let allExercises = [];
        let doneTasks = 0;

        async function loadData() {
            try {
                // 1. Cargar Mensaje del Día
                const resConfig = await fetch(URL_CONFIG);
                const textConfig = await resConfig.text();
                const jsonConfig = JSON.parse(textConfig.substr(47).slice(0, -2));
                // Asumimos que el mensaje está en la celda B2 (fila 0 de datos, columna 1)
                const mensaje = jsonConfig.table.rows[0].c[1]?.v || "¡A bailar!";
                document.getElementById('daily-message').innerText = `"${mensaje}"`;

                // 2. Cargar Ejercicios
                const resEx = await fetch(URL_EJERCICIOS);
                const textEx = await resEx.text();
                const jsonEx = JSON.parse(textEx.substr(47).slice(0, -2));
                
                allExercises = jsonEx.table.rows.map(r => ({
                    cat: r.c[1]?.v || 'General',
                    titulo: r.c[2]?.v || 'Ejercicio',
                    desc: r.c[3]?.v || '',
                    icon: getIcon(r.c[1]?.v)
                }));

                document.getElementById('loader').style.display = 'none';
                render(allExercises);

            } catch (e) {
                console.error("Error cargando:", e);
                document.getElementById('loader').innerText = "Revisa que tu hoja esté publicada en la web.";
            }
        }

        function getIcon(cat) {
            if(cat === 'Pies') return '🩰';
            if(cat === 'Brazos') return '👐';
            if(cat === 'Movimiento') return '✨';
            return '🌸';
        }

        function render(data) {
            const list = document.getElementById('exercise-list');
            list.innerHTML = '';
            data.forEach(ex => {
                const card = document.createElement('div');
                card.className = 'exercise-card';
                card.innerHTML = `
                    <div class="icon-box">${ex.icon}</div>
                    <div class="card-body">
                        <h3>${ex.titulo}</h3>
                        <p>${ex.desc}</p>
                    </div>
                    <button class="btn-check" onclick="completeTask(this)">⭐</button>
                `;
                list.appendChild(card);
            });
        }

        function filterData(cat, el) {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            if(cat === 'Todos') render(allExercises);
            else render(allExercises.filter(e => e.cat === cat));
        }

        function completeTask(btn) {
            if(!btn.classList.contains('done')) {
                btn.classList.add('done');
                btn.innerText = '✔';
                doneTasks++;
                
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#FADADD', '#D4AF37']
                });
                document.getElementById('pop-sound').play();
            } else {
                btn.classList.remove('done');
                btn.innerText = '⭐';
                doneTasks--;
            }
            updateProgress();
        }

        function updateProgress() {
            const percent = (doneTasks / allExercises.length) * 100;
            document.getElementById('progress-bar').style.width = percent + '%';
        }

        loadData();
    </script>
</body>
</html>
