<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🩰 Mi Diario de Ballet Interactivo</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --rosa-principal: #FADADD;
            --dorado: #D4AF37;
            --texto: #4E342E;
            --blanco-papel: #FFFFFF;
            --azul-borde: #00BCD4; 
            --verde-menta: #f0fafa;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: #1a2a2a; 
            margin: 0; padding: 10px;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }

        .main-wrapper {
            display: flex; align-items: center;
            width: 100%; max-width: 1100px;
        }

        .side-tabs {
            display: flex; flex-direction: column; gap: 8px;
            z-index: 1; margin-right: -5px;
        }

        .tab-btn {
            background: var(--rosa-principal); border: none;
            border-radius: 12px 0 0 12px; padding: 15px;
            cursor: pointer; font-size: 1.4rem; transition: 0.3s;
            box-shadow: -4px 4px 10px rgba(0,0,0,0.3);
        }

        .tab-btn.active { background: var(--blanco-papel); transform: translateX(8px); }

        .book-container {
            flex: 1; background: var(--azul-borde);
            padding: 12px; border-radius: 15px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            position: relative; z-index: 2;
        }

        .book-content {
            background: var(--blanco-papel);
            display: flex; min-height: 550px; height: 85vh;
            border-radius: 5px; position: relative;
            background-image: linear-gradient(to right, #e0e0e0 0%, #fff 5%, #fff 45%, #b1b1b1 50%, #fff 55%, #fff 95%, #e0e0e0 100%);
        }

        .page {
            flex: 1; padding: 30px 40px;
            display: flex; flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .content-area {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 50px;
            padding-right: 10px;
        }

        .content-area::-webkit-scrollbar { width: 5px; }
        .content-area::-webkit-scrollbar-thumb { background: var(--rosa-principal); border-radius: 10px; }

        .index-item {
            padding: 10px 0; border-bottom: 1px dashed #eee;
            cursor: pointer; display: flex; justify-content: space-between;
            font-size: 0.95rem;
        }

        .arrow {
            position: absolute; bottom: 20px;
            background: #4a90e2; color: white; border: none;
            width: 40px; height: 40px; border-radius: 8px;
            cursor: pointer; font-size: 1.2rem; display: flex;
            align-items: center; justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            z-index: 20;
        }
        .arrow-prev { left: 20px; }
        .arrow-next { right: 20px; }

        .exercise-focus { text-align: center; }
        
        .img-large {
            width: 100%; max-height: 280px; object-fit: contain;
            border: 5px solid white; border-radius: 5px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            background: #f9f9f9;
        }

        .welcome-screen {
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
        }

        .btn-reset {
            background: var(--rosa-principal);
            border: 2px solid var(--dorado);
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Quicksand';
            font-weight: bold;
            margin-top: 20px;
            transition: 0.3s;
        }
        .btn-reset:hover { background: var(--dorado); color: white; }

        @media (max-width: 800px) {
            .book-content { flex-direction: column; height: auto; }
            .page { min-height: 400px; }
            .side-tabs { display: none; }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="side-tabs">
            <button class="tab-btn active" id="btn-home" onclick="goHome(this)">🏠</button>
            <button class="tab-btn" onclick="changeCategory('Pies', this)">🩰</button>
            <button class="tab-btn" onclick="changeCategory('Brazos', this)">👐</button>
            <button class="tab-btn" onclick="changeCategory('Movimiento', this)">✨</button>
        </div>

        <div class="book-container">
            <div class="book-content" id="book-inner">
                </div>
        </div>
    </div>

    <script>
    const SHEET_ID = '1KcKRT5gZqatDkeRsQQa6_aWBr9gnrkGRR1vsmZjmRoI';
    const GID_EJERCICIOS = '0';
    const GID_CONFIG = '1864195759'; 

    const URL_EJERCICIOS = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID_EJERCICIOS}`;
    const URL_CONFIG = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID_CONFIG}`;
    
    let allExercises = [];
    let filteredExercises = [];
    let currentIndex = -1; 
    let fraseDia = "¡Inspiración en camino...";
    let completedSet = new Set();

    if(localStorage.getItem('balletProgress')) {
        completedSet = new Set(JSON.parse(localStorage.getItem('balletProgress')));
    }

    // Función mágica para separar por comas ignorando las que están entre comillas
    function splitCSV(row) {
        const regex = /,(?=(?:(?:[^"]*"){2})*[^"]*$)/;
        return row.split(regex).map(c => c.replace(/^"|"$/g, '').trim());
    }

    async function init() {
        try {
            // 1. Cargar Configuración
            // 1. Cargar Configuración (Mensaje del día)
            const resConfig = await fetch(URL_CONFIG);
            const csvConfig = await resConfig.text();
            const configLines = csvConfig.split(/\r?\n/);

            // Buscamos la fila donde la primera columna sea exactamente MensajeDelDia
            for (let line of configLines) {
                const cols = splitCSV(line); // Usamos tu función para separar por comas
                // cols[0] es la Clave, cols[1] es el Valor
                if (cols[0] && cols[0].trim().replace(/"/g, '') === "MensajeDelDia") {
                    fraseDia = cols[1] ? cols[1].trim() : "¡Aun no carga!";
                    break; // Una vez encontrado, dejamos de buscar
                }
            }

            if (filaMensaje) {
                // Usamos la función splitCSV que ya tienes para separar Clave y Valor
                const configCols = splitCSV(filaMensaje); 
                // configCols[0] es "MensajeDelDia", configCols[1] es el mensaje real
                fraseDia = configCols[1] || "¡Hoy vas a brillar como una estrella! ✨";
            } else {
                fraseDia = "¡A bailar!"; // Valor por defecto si no lo encuentra
            }
            // 2. Cargar Ejercicios
            const resEx = await fetch(URL_EJERCICIOS);
            const csvEx = await resEx.text();
            const rows = csvEx.split(/\r?\n/).slice(1); 
            
            allExercises = rows.filter(row => row.trim() !== "").map((row, i) => {
                const cols = splitCSV(row);
                return {
                    id: i,
                    cat: cols[1] || 'Varios',
                    titulo: cols[2] || 'Ejercicio',
                    desc: cols[3] || '',
                    // Columna 5 es "Imagen (Referencia)" según tu tabla
                    img: cols[5] || '' 
                };
            });

            filteredExercises = [...allExercises];
            renderBook();
        } catch (e) {
            console.error("Error cargando datos:", e);
            document.getElementById('book-inner').innerHTML = `
                <div class="page" style="text-align:center; justify-content:center;">
                    <h2 style="color:var(--dorado)">⚠️ No se pudo conectar con el libro.</h2>
                    <p>Verifica que el archivo esté publicado en la Web como CSV.</p>
                </div>`;
        }
    }

    function renderBook() {
        const container = document.getElementById('book-inner');
        const total = allExercises.length;
        const done = completedSet.size;
        const porcentaje = total > 0 ? Math.round((done/total)*100) : 0;

        if (currentIndex === -1) {
            container.innerHTML = `
                <div class="page">
                    <div class="welcome-screen">
                        <h1 style="font-family:'Dancing Script'; color:var(--dorado); font-size: 3rem;">Mi Diario de Ballet</h1>
                        <div style="background: var(--verde-menta); padding: 20px; border-radius: 15px; border: 2px dashed var(--rosa-principal);">
                            <p style="font-style:italic; font-size:1.3rem; color: var(--texto); margin:0;">"${fraseDia}"</p>
                        </div>
                        <button class="btn-reset" onclick="resetProgress()">🔄 Reiniciar progreso</button>
                    </div>
                </div>
                <div class="page">
                    <h2 style="font-family:'Dancing Script'; color:var(--dorado); margin-top:0;">Índice de Ejercicios</h2>
                    <p>Progreso total: <strong>${porcentaje}%</strong> (${done}/${total} ⭐)</p>
                    <div class="content-area">${generateIndexHTML()}</div>
                </div>
            `;
        } else {
            const ex = filteredExercises[currentIndex];
            const isDone = completedSet.has(ex.id);
            // Se asegura de que la ruta sea img/nombre_archivo.png
            const imagePath = ex.img ? `img/${ex.img}` : 'https://via.placeholder.com/400x300?text=Sin+Imagen';

            container.innerHTML = `
                <div class="page">
                    <h2 style="font-family:'Dancing Script'; color:var(--dorado); margin-top:0;">Clases</h2>
                    <div class="content-area">${generateIndexHTML()}</div>
                    <button class="arrow arrow-prev" onclick="prevPage()">⬅</button>
                </div>
                <div class="page">
                    <div class="exercise-focus">
                        <h2 style="font-family:'Dancing Script'; color:var(--dorado); margin-top:0; font-size: 2.2rem;">${ex.titulo}</h2>
                        <img src="${imagePath}" class="img-large" onerror="this.src='https://via.placeholder.com/400x300?text=No+encontrada:+${ex.img}'">
                        <p style="margin:15px 0; font-size: 1.1rem; color:#4E342E;">${ex.desc}</p>
                        <button onclick="toggleStar(${ex.id})" style="background:none; border:none; font-size:4rem; cursor:pointer; transition: 0.3s transform;">
                            ${isDone ? '✅' : '⭐'}
                        </button>
                    </div>
                    <button class="arrow arrow-next" onclick="nextPage()">➡</button>
                </div>
            `;
        }
    }

    function generateIndexHTML() {
        return filteredExercises.map((ex, i) => `
            <div class="index-item" style="font-weight: ${currentIndex === i ? 'bold' : 'normal'}; background: ${currentIndex === i ? '#fff5f6' : 'transparent'}" onclick="selectExercise(${i})">
                <span>${i+1}. ${ex.titulo}</span>
                <span>${completedSet.has(ex.id) ? '✅' : '⚪'}</span>
            </div>
        `).join('');
    }

    function selectExercise(i) { currentIndex = i; renderBook(); }
    function goHome(btn) { updateActiveTab(btn); currentIndex = -1; filteredExercises = [...allExercises]; renderBook(); }
    
    function changeCategory(cat, btn) {
        updateActiveTab(btn);
        filteredExercises = allExercises.filter(e => e.cat.toLowerCase().includes(cat.toLowerCase()));
        currentIndex = filteredExercises.length > 0 ? 0 : -1;
        renderBook();
    }

    function updateActiveTab(btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function toggleStar(id) {
        if(completedSet.has(id)) {
            completedSet.delete(id);
        } else {
            completedSet.add(id);
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.8 } });
        }
        localStorage.setItem('balletProgress', JSON.stringify(Array.from(completedSet)));
        renderBook();
    }

    function resetProgress() {
        if(confirm("¿Quieres borrar todas tus estrellas?")) {
            completedSet.clear();
            localStorage.removeItem('balletProgress');
            renderBook();
        }
    }

    function nextPage() { if (currentIndex < filteredExercises.length - 1) { currentIndex++; renderBook(); } }
    function prevPage() { if (currentIndex > 0) { currentIndex--; renderBook(); } }

    init();
</script>
</body>
</html>
