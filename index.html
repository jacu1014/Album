<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🩰 Mi Diario de Ballet</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --rosa-principal: #FADADD;
            --rosa-fuerte: #F8BBD0;
            --verde-menta: #E0F2F1;
            --dorado: #D4AF37;
            --texto: #4E342E;
            --blanco-papel: #FFFFFF;
            --azul-borde: #00BCD4; 
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: #1a2a2a; 
            margin: 0; padding: 20px;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }

        /* Contenedor principal con el menú lateral (separadores) */
        .main-container {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 1200px;
        }

        /* Menú tipo separadores (izquierda) */
        .side-tabs {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-right: -5px; /* Para que parezca que salen de debajo del libro */
            z-index: 1;
        }

        .tab-btn {
            background: var(--rosa-principal);
            border: none;
            border-radius: 10px 0 0 10px;
            padding: 15px;
            cursor: pointer;
            font-size: 1.5rem;
            transition: 0.3s;
            box-shadow: -4px 4px 10px rgba(0,0,0,0.2);
        }

        .tab-btn.active {
            background: var(--blanco-papel);
            transform: translateX(5px);
            box-shadow: -6px 6px 15px rgba(0,0,0,0.3);
        }

        /* Estructura del Libro */
        .book-frame {
            background: var(--azul-borde);
            padding: 15px; border-radius: 15px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            flex: 1;
            position: relative;
            z-index: 2;
        }

        .book-pages {
            background: var(--blanco-papel);
            display: flex; min-height: 650px;
            position: relative; border-radius: 5px;
            overflow: hidden;
            /* El degradado crea la sombra del lomo en el centro exacto */
            background-image: linear-gradient(to right, 
                #e0e0e0 0%, #fff 5%, 
                #fff 42%, #b1b1b1 50%, #fff 58%, 
                #fff 95%, #e0e0e0 100%);
        }

        /* Contenedores de las páginas para evitar que choquen con el lomo */
        .page-left, .page-right {
            flex: 1;
            padding: 40px 50px; /* Margen amplio para no tocar el centro */
            display: flex;
            flex-direction: column;
            z-index: 5;
        }

        /* Estadísticas en la página izquierda */
        .stats-book {
            background: var(--verde-menta);
            padding: 20px; border-radius: 15px;
            text-align: center; margin-bottom: 25px;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .stat-circle {
            font-size: 2rem; font-weight: bold; color: var(--dorado);
            display: block; margin-top: 5px;
        }

        /* Cuadrícula de ejercicios (2 por página, título arriba, foto abajo) */
        .exercise-grid {
            display: grid;
            grid-template-columns: 1fr; /* Uno sobre otro en cada página */
            gap: 30px;
        }

        .exercise-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            background: rgba(255,255,255,0.5);
            border-radius: 10px;
            padding: 10px;
            position: relative;
        }

        .exercise-header {
            margin-bottom: 10px;
        }

        .exercise-header h3 {
            margin: 0; font-size: 1.1rem; color: var(--texto);
            font-family: 'Quicksand', sans-serif;
        }

        .exercise-img {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            border: 4px solid white;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .desc-text {
            font-size: 0.85rem; color: #666; margin: 8px 0;
            line-height: 1.3;
        }

        .btn-check {
            position: absolute; bottom: 15px; right: 15px;
            width: 40px; height: 40px; border-radius: 50%;
            border: 2px solid var(--rosa-principal); background: white;
            cursor: pointer; font-size: 18px; transition: 0.3s;
        }

        .btn-check.done {
            background: var(--dorado); color: white; border-color: var(--dorado);
        }

        h1 { font-family: 'Dancing Script', cursive; color: var(--dorado); text-align: center; margin-top: 0; }

        @media (max-width: 900px) {
            .book-pages { flex-direction: column; }
            .main-container { flex-direction: column-reverse; }
            .side-tabs { flex-direction: row; margin-right: 0; margin-top: -5px; }
            .tab-btn { border-radius: 0 0 10px 10px; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="side-tabs">
            <button class="tab-btn active" onclick="filterData('Todos', this)">🏠</button>
            <button class="tab-btn" onclick="filterData('Pies', this)">🩰</button>
            <button class="tab-btn" onclick="filterData('Brazos', this)">👐</button>
            <button class="tab-btn" onclick="filterData('Movimiento', this)">✨</button>
        </div>

        <div class="book-frame">
            <div class="book-pages">
                <div class="page-left">
                    <h1>Mi Diario</h1>
                    <div class="stats-book">
                        Progreso Actual: <span class="stat-circle" id="stat-pc">0%</span>
                        <small id="stat-count">0 / 0 estrellas</small>
                    </div>
                    <div class="exercise-grid" id="grid-left">
                        </div>
                </div>

                <div class="page-right">
                    <div class="exercise-grid" id="grid-right">
                        </div>
                </div>
            </div>
        </div>
    </div>

    <audio id="pop-sound" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"></audio>

    <script>
        const SHEET_ID = '1KcKRT5gZqatDkeRsQQa6_aWBr9gnrkGRR1vsmZjmRoI';
        const URL_EJERCICIOS = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Ejercicios`;
        
        let allExercises = [];
        let completedSet = new Set();

        async function loadData() {
            try {
                const res = await fetch(URL_EJERCICIOS);
                const text = await res.text();
                const json = JSON.parse(text.substring(text.indexOf("{"), text.lastIndexOf("}") + 1));
                
                allExercises = json.table.rows.map((r, i) => ({
                    id: i,
                    cat: r.c[1]?.v || '',
                    titulo: r.c[2]?.v || 'Ejercicio',
                    desc: r.c[3]?.v || '',
                    img: r.c[4]?.v || 'https://via.placeholder.com/400x300?text=Ballet'
                }));

                render('Todos');
                updateStats();
            } catch (e) { console.error(e); }
        }

        function render(filter) {
            const left = document.getElementById('grid-left');
            const right = document.getElementById('grid-right');
            left.innerHTML = '';
            right.innerHTML = '';

            const filtered = filter === 'Todos' ? allExercises : allExercises.filter(e => e.cat.includes(filter));

            filtered.forEach((ex, index) => {
                const html = `
                    <div class="exercise-item">
                        <div class="exercise-header"><h3>${ex.titulo}</h3></div>
                        <img src="${ex.img}" class="exercise-img">
                        <p class="desc-text">${ex.desc}</p>
                        <button class="btn-check ${completedSet.has(ex.id) ? 'done' : ''}" onclick="toggleTask(${ex.id}, this)">
                            ${completedSet.has(ex.id) ? '✔' : '⭐'}
                        </button>
                    </div>
                `;
                
                // Distribuye: los primeros 2 a la izquierda, el resto a la derecha
                if (index < 2) left.innerHTML += html;
                else if (index < 4) right.innerHTML += html;
            });
        }

        function toggleTask(id, btn) {
            if(completedSet.has(id)) {
                completedSet.delete(id);
                btn.classList.remove('done'); btn.innerText = '⭐';
            } else {
                completedSet.add(id);
                btn.classList.add('done'); btn.innerText = '✔';
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.8 }, colors: ['#D4AF37', '#FADADD'] });
                document.getElementById('pop-sound').play();
            }
            updateStats();
        }

        function updateStats() {
            const total = allExercises.length;
            const done = completedSet.size;
            const pc = total > 0 ? Math.round((done / total) * 100) : 0;
            document.getElementById('stat-pc').innerText = pc + '%';
            document.getElementById('stat-count').innerText = `${done} / ${total} estrellas`;
        }

        function filterData(cat, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render(cat);
        }

        loadData();
    </script>
</body>
</html>
