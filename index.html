<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🩰 Mi Diario de Ballet Interactivo</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --rosa-principal: #FADADD;
            --dorado: #D4AF37;
            --texto: #4E342E;
            --blanco-papel: #FFFFFF;
            --azul-borde: #00BCD4; 
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: #1a2a2a; 
            margin: 0; padding: 20px;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow-x: hidden;
        }

        /* Estructura General */
        .main-wrapper {
            display: flex; align-items: center;
            width: 100%; max-width: 1000px; gap: 0;
        }

        /* Pestañas laterales (Filtros) */
        .side-tabs {
            display: flex; flex-direction: column; gap: 8px;
            z-index: 1; margin-right: -5px;
        }

        .tab-btn {
            background: var(--rosa-principal); border: none;
            border-radius: 12px 0 0 12px; padding: 18px;
            cursor: pointer; font-size: 1.6rem; transition: 0.3s;
            box-shadow: -4px 4px 10px rgba(0,0,0,0.3);
        }

        .tab-btn.active {
            background: var(--blanco-papel); transform: translateX(8px);
        }

        /* Libro Contenedor */
        .book-container {
            flex: 1; background: var(--azul-borde);
            padding: 15px; border-radius: 15px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            position: relative; z-index: 2;
        }

        .book-content {
            background: var(--blanco-papel);
            display: flex; min-height: 600px;
            border-radius: 5px; position: relative;
            background-image: linear-gradient(to right, #e0e0e0 0%, #fff 5%, #fff 45%, #b1b1b1 50%, #fff 55%, #fff 95%, #e0e0e0 100%);
            box-shadow: inset 0 0 100px rgba(0,0,0,0.05);
        }

        /* Páginas */
        .page {
            flex: 1; padding: 40px;
            display: flex; flex-direction: column;
            transition: opacity 0.4s ease;
        }

        /* Elementos de Ejercicio Único */
        .exercise-focus {
            text-align: center; animation: fadeInPage 0.6s ease;
        }

        .exercise-focus h2 {
            font-family: 'Dancing Script', cursive;
            color: var(--dorado); font-size: 2.2rem; margin: 0 0 15px;
        }

        .img-large {
            width: 100%; max-height: 300px; object-fit: cover;
            border: 8px solid white; border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        .desc-large {
            font-size: 1.1rem; line-height: 1.6; color: var(--texto);
            margin: 20px 0; font-style: italic;
        }

        /* Botón Estrella Gigante */
        .star-container { margin-top: auto; text-align: center; }
        .big-star {
            background: white; border: 3px solid var(--rosa-principal);
            width: 70px; height: 70px; border-radius: 50%;
            font-size: 30px; cursor: pointer; transition: 0.3s;
        }
        .big-star.done { background: var(--dorado); color: white; border-color: var(--dorado); transform: scale(1.1); }

        /* Controles de Navegación */
        .nav-arrows {
            position: absolute; bottom: 20px; width: 100%;
            display: flex; justify-content: space-between; padding: 0 40px;
            box-sizing: border-box; z-index: 10;
        }

        .arrow {
            background: rgba(0,0,0,0.05); border: none; font-size: 2rem;
            cursor: pointer; border-radius: 50%; width: 50px; height: 50px;
            transition: 0.3s; color: var(--texto);
        }
        .arrow:hover { background: var(--rosa-principal); }

        /* Índice y Progreso */
        .index-list { list-style: none; padding: 0; text-align: left; }
        .index-item {
            padding: 8px 0; border-bottom: 1px dashed #eee;
            cursor: pointer; display: flex; justify-content: space-between;
        }
        .index-item:hover { color: var(--dorado); }

        .progress-box {
            background: var(--verde-menta); padding: 25px;
            border-radius: 20px; text-align: center; margin-bottom: 20px;
        }
        .circle-percent { font-size: 3rem; font-weight: bold; color: var(--dorado); }

        @keyframes fadeInPage { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 800px) {
            .book-content { flex-direction: column; background-image: none; }
            .page-right { border-top: 2px solid #eee; }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="side-tabs">
            <button class="tab-btn active" onclick="changeCategory('Todos', this)">🏠</button>
            <button class="tab-btn" onclick="changeCategory('Pies', this)">🩰</button>
            <button class="tab-btn" onclick="changeCategory('Brazos', this)">👐</button>
            <button class="tab-btn" onclick="changeCategory('Movimiento', this)">✨</button>
        </div>

        <div class="book-container">
            <div class="book-content">
                <div class="page">
                    <h1>Resumen</h1>
                    <div class="progress-box">
                        <div class="circle-percent" id="ui-percent">0%</div>
                        <div id="ui-stars">0 / 0 Estrellas</div>
                    </div>
                    <h3>Índice de Ejercicios</h3>
                    <div class="index-list" id="ui-index">
                        </div>
                </div>

                <div class="page" id="page-render">
                    </div>

                <div class="nav-arrows">
                    <button class="arrow" onclick="prevPage()">⬅️</button>
                    <button class="arrow" onclick="nextPage()">➡️</button>
                </div>
            </div>
        </div>
    </div>

    <audio id="pop-sound" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"></audio>

    <script>
        const SHEET_ID = '1KcKRT5gZqatDkeRsQQa6_aWBr9gnrkGRR1vsmZjmRoI';
        const URL_EJERCICIOS = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Ejercicios`;
        
        let allExercises = [];
        let filteredExercises = [];
        let currentIndex = 0;
        let completedSet = new Set();

        async function init() {
            try {
                const res = await fetch(URL_EJERCICIOS);
                const text = await res.text();
                const json = JSON.parse(text.substring(text.indexOf("{"), text.lastIndexOf("}") + 1));
                
                allExercises = json.table.rows.map((r, i) => ({
                    id: i,
                    cat: r.c[1]?.v || 'Varios',
                    titulo: r.c[2]?.v || 'Ejercicio',
                    desc: r.c[3]?.v || 'Sin descripción disponible.',
                    img: r.c[4]?.v || 'https://images.unsplash.com/photo-1547153760-18fc86324498?w=500'
                }));

                filteredExercises = [...allExercises];
                updateUI();
                renderPage();
            } catch (e) { console.error("Error cargando el libro:", e); }
        }

        function renderPage() {
            const container = document.getElementById('page-render');
            const ex = filteredExercises[currentIndex];

            if (!ex) {
                container.innerHTML = "<h2>¡Selecciona una categoría!</h2>";
                return;
            }

            const isDone = completedSet.has(ex.id);

            container.innerHTML = `
                <div class="exercise-focus">
                    <small style="color:var(--dorado)">${ex.cat} • Página ${currentIndex + 1}</small>
                    <h2>${ex.titulo}</h2>
                    <img src="${ex.img}" class="img-large" onerror="this.src='https://via.placeholder.com/500x350?text=Ballet'">
                    <p class="desc-large">${ex.desc}</p>
                    <div class="star-container">
                        <button class="big-star ${isDone ? 'done' : ''}" onclick="toggleStar(${ex.id})">
                            ${isDone ? '✔' : '⭐'}
                        </button>
                    </div>
                </div>
            `;
        }

        function updateUI() {
            // Actualizar Índice
            const indexList = document.getElementById('ui-index');
            indexList.innerHTML = '';
            filteredExercises.forEach((ex, i) => {
                const item = document.createElement('div');
                item.className = 'index-item';
                item.innerHTML = `<span>${i+1}. ${ex.titulo}</span> <span>${completedSet.has(ex.id) ? '✅' : '⚪'}</span>`;
                item.onclick = () => { currentIndex = i; renderPage(); };
                indexList.appendChild(item);
            });

            // Actualizar Progreso
            const total = allExercises.length;
            const done = completedSet.size;
            const pc = total > 0 ? Math.round((done / total) * 100) : 0;
            document.getElementById('ui-percent').innerText = pc + '%';
            document.getElementById('ui-stars').innerText = `${done} / ${total} Estrellas`;
        }

        function toggleStar(id) {
            if(completedSet.has(id)) completedSet.delete(id);
            else {
                completedSet.add(id);
                confetti({ particleCount: 150, spread: 100, origin: { y: 0.7 }, colors: ['#FADADD', '#D4AF37'] });
                document.getElementById('pop-sound').play();
            }
            updateUI();
            renderPage();
        }

        function nextPage() {
            if (currentIndex < filteredExercises.length - 1) {
                currentIndex++;
                renderPage();
            }
        }

        function prevPage() {
            if (currentIndex > 0) {
                currentIndex--;
                renderPage();
            }
        }

        function changeCategory(cat, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            filteredExercises = cat === 'Todos' ? [...allExercises] : allExercises.filter(e => e.cat.includes(cat));
            currentIndex = 0;
            updateUI();
            renderPage();
        }

        init();
    </script>
</body>
</html>
